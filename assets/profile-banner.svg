<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Thilak — Code, systems, and small experiments</title>
  <desc id="desc">A dark editorial poster with a halftone flower, fine grid, and minimal typography.</desc>
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#d8d5cf" opacity=".8"/>
    </pattern>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <mask id="petals">
      <rect width="1200" height="430" fill="black"/>
      <g fill="white" transform="translate(905 214)">
        <ellipse rx="70" ry="167" transform="rotate(0) translate(0 -88)"/>
        <ellipse rx="70" ry="167" transform="rotate(45) translate(0 -88)"/>
        <ellipse rx="70" ry="167" transform="rotate(90) translate(0 -88)"/>
        <ellipse rx="70" ry="167" transform="rotate(135) translate(0 -88)"/>
      </g>
    </mask>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#070707" stop-opacity=".1"/>
      <stop offset=".58" stop-color="#070707" stop-opacity=".12"/>
      <stop offset="1" stop-color="#070707" stop-opacity=".02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" fill="#090909"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <rect width="1200" height="430" fill="url(#dots)" mask="url(#petals)" opacity=".8"/>
  <rect width="1200" height="430" fill="url(#fade)"/>
  <path d="M52 55H1148M52 375H1148" stroke="#f0eee8" stroke-opacity=".25"/>
  <text x="56" y="42" fill="#aaa79f" font-family="monospace" font-size="12" letter-spacing="3">PERSONAL FIELD NOTES / 2026</text>
  <text x="1144" y="42" fill="#aaa79f" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2">CSE · BUILDER · LEARNER</text>
  <text x="66" y="204" fill="#f4f2ed" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" letter-spacing="-5">THILAK</text>
  <text x="70" y="247" fill="#c3bfff" font-family="monospace" font-size="14" letter-spacing="4">CODE / SYSTEMS / SMALL EXPERIMENTS</text>
  <path d="M70 282h44m-22-22v44" stroke="#aaa4ff" stroke-width="1"/>
  <text x="70" y="328" fill="#c7c4bd" font-family="Georgia, serif" font-size="20" font-style="italic">Curious by nature. Building as I go.</text>
  <g fill="#aaa79f" font-family="monospace" font-size="11" letter-spacing="2">
    <text x="56" y="405">HOME LAB</text><text x="600" y="405" text-anchor="middle">AUTOMATION</text><text x="1144" y="405" text-anchor="end">ALWAYS LEARNING</text>
  </g>
  <circle cx="905" cy="214" r="9" fill="#aaa4ff"/>
</svg>
